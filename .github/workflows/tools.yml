name: Installer and updater checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.315
      - name: Build own helpers
        run: |
          dotnet build launcher/SteamLicenseGate.csproj -c Release --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build engine/EnginePatch.csproj -c Release --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build bootstrap/SourceBuild/SourceBuild.csproj -c Release --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet launcher/bin/Release/net8.0/SteamLicenseGate.dll --self-test
          exit $LASTEXITCODE
      - name: Installer transactions and input validation
        run: ./bootstrap/tests/Test-Install.ps1
      - name: Official-source resolver
        run: ./bootstrap/tests/Test-OfficialResolver.ps1
      - name: Compatible GitHub updater
        run: ./tests/updater/Test-GitHubUpdater.ps1
      - name: Legacy launcher host signatures
        run: |
          $signed = Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe'
          $test = Join-Path $PWD 'ops\legacy-ftp\Test-LaunchHostSignature.ps1'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File $test -SignedPowerShell $signed -TestRoot (Join-Path $env:RUNNER_TEMP 'DingDong-HostSig-WinPS') -Output (Join-Path $env:RUNNER_TEMP 'DingDong-HostSig-WinPS.json')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $signed -NoProfile -File $test -SignedPowerShell $signed -TestRoot (Join-Path $env:RUNNER_TEMP 'DingDong-HostSig-Core') -Output (Join-Path $env:RUNNER_TEMP 'DingDong-HostSig-Core.json')
          exit $LASTEXITCODE
